<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Farm - Cutesy Nebula</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body { margin: 0; overflow: hidden; background: #05010a; touch-action: none; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; }
        
        /* UI OVERLAY */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #start-btn { padding: 15px 40px; font-size: 24px; background: #ff4081; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 0 20px rgba(255, 64, 129, 0.6); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #hud { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 100; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        #inventory { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 12px; color: white; border: 1px solid rgba(255,255,255,0.2); font-size: 14px; font-weight: bold; pointer-events: none; line-height: 1.6; }
        #planet-name { font-size: 18px; font-weight: 900; letter-spacing: 1px; display: block; margin-bottom: 5px; background: rgba(0,0,0,0.6); padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); }
        
        /* ARCHED CELESTIAL HUD */
        #cycle-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 240px; height: 60px; z-index: 101; pointer-events: none; }
        .hud-dot { position: absolute; background: rgba(255,255,255,0.4); border-radius: 50%; }
        #celestial-icon { position: absolute; font-size: 24px; transition: transform 0.1s linear; filter: drop-shadow(0 0 8px orange); margin-left: -12px; margin-top: -12px; }

        /* STAMINA BAR */
        .stat-bar { display: inline-block; width: 54px; height: 8px; background: rgba(255,255,255,0.25); border-radius: 4px; vertical-align: middle; overflow: hidden; margin-left: 3px; }
        .stat-bar-fill { display: block; height: 100%; background: #ffca28; transition: width 0.25s; }
        #mp-toggle { position: absolute; top: 20px; right: 78px; width: 48px; height: 48px; background: #fff; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 21px; z-index: 110; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #ddd; cursor: pointer; }
        #mp-panel { position: absolute; top: 90px; right: 25px; width: 220px; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.25); border-radius: 14px; padding: 14px; color: white; z-index: 109; display: none; flex-direction: column; gap: 8px; text-align: center; font-size: 13px; }
        #mp-panel.open { display: flex; }
        .mp-btn { padding: 8px; border-radius: 10px; border: none; background: #ff4081; color: white; font-weight: bold; cursor: pointer; }
        .mp-or { opacity: 0.6; font-size: 11px; }
        #mp-join-code { padding: 6px; border-radius: 8px; border: none; text-align: center; text-transform: uppercase; }
        #mp-status { min-height: 16px; opacity: 0.85; }

        /* CONTROLS */
        .joystick-base { position: absolute; width: 80px; height: 80px; background: rgba(255,255,255,0.1); border-radius: 50%; display: none; border: 2px solid rgba(255,255,255,0.2); z-index: 51; pointer-events: none; }
        .joystick-knob { position: absolute; width: 32px; height: 32px; background: #fff; border-radius: 50%; left: 24px; top: 24px; opacity: 0.6; }
        
        #jump-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; background: rgba(255, 255, 255, 0.15); border: 4px solid white; border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; z-index: 90; backdrop-filter: blur(4px); cursor: pointer; user-select: none; }

        #tool-toggle { position: absolute; top: 20px; right: 20px; width: 48px; height: 48px; background: #fff; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 110; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #ddd; cursor: pointer; }
        #tool-list { position: absolute; top: 90px; right: 25px; display: flex; flex-direction: column; gap: 12px; z-index: 109; transition: 0.3s; opacity: 0; transform: translateY(-20px); pointer-events: none; }
        #tool-list.open { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .tool { width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(0,0,0,0.8); color: white; cursor: pointer; }
        .tool.active { background: #fff; color: #000; transform: scale(1.1); }

        /* CROP SELECT BAR (shown while Seed tool active) */
        #crop-bar { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; z-index: 108; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.2); }
        #crop-bar.open { display: flex; }
        .crop-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(0,0,0,0.5); color: white; cursor: pointer; }
        .crop-btn.active { background: #fff; transform: scale(1.1); }
        
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; z-index: 100; display: none; }

        .baaa-bubble { position: absolute; background: black; color: white; padding: 4px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; pointer-events: none; border: 2px solid white; transition: opacity 0.5s; z-index: 95; }
    </style>

<body>
    <div id="start-screen">
        <h1>Galaxy Farm</h1>
        <button id="start-btn" onclick="startGame()">TAP TO START</button>
        <p style="margin-top:15px; opacity: 0.7; font-size: 14px;">Sticks: Bottom Corners • Action: Top 75% Screen</p>
    </div>

    <div id="cycle-container"><div id="celestial-icon">☀️</div></div>
    <div id="inventory">🪓10 🪨5 💰100<br>📅Day 1 ⚡<span class="stat-bar"><span class="stat-bar-fill" style="width:100%"></span></span><br>🌍 <span class="stat-bar" id="terraform-bar"><span class="stat-bar-fill" id="terraform-fill" style="background:#8bc34a;width:0%"></span></span> <span id="terraform-pct">0%</span></div>
    <div id="hud"><span id="planet-name">HOME GREEN</span>
        <div id="status">🚜 PLOW</div></div>
    <div id="crosshair"></div>
    <div id="jump-btn">JUMP</div>

    <div id="tool-toggle" onclick="toggleTools()">🎒</div>
    <div id="mp-toggle" onclick="toggleMP()">👥</div>
    <div id="mp-panel">
        <button class="mp-btn" onclick="hostGame()">Host a Farm</button>
        <div id="mp-room-row" style="display:none">Room code: <b id="mp-room-code"></b></div>
        <div class="mp-or">— or —</div>
        <input id="mp-join-code" placeholder="Enter room code" maxlength="6">
        <button class="mp-btn" onclick="joinGame()">Join Farm</button>
        <div id="mp-status"></div>
    </div>
    <div id="tool-list">
        <div class="tool active" id="tool-plow" onclick="selectTool('plow')">🚜</div>
        <div class="tool" id="tool-seed" onclick="selectTool('seed')">🌱</div>
        <div class="tool" id="tool-water" onclick="selectTool('water')">💧</div>
        <div class="tool" id="tool-hammer" onclick="selectTool('hammer')">🔨</div>
        <div class="tool" id="tool-fence" onclick="selectTool('fence')">🚧</div>
    </div>
    <div id="crop-bar">
        <div class="crop-btn active" data-crop="turnip" onclick="selectCrop('turnip')">🥬</div>
        <div class="crop-btn" data-crop="tomato" onclick="selectCrop('tomato')">🍅</div>
        <div class="crop-btn" data-crop="pumpkin" onclick="selectCrop('pumpkin')">🎃</div>
    </div>

    <div id="joy-L-base" class="joystick-base"><div id="joy-L-knob" class="joystick-knob"></div></div>
    <div id="joy-R-base" class="joystick-base"><div id="joy-R-knob" class="joystick-knob"></div></div>
    
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';

        // --- AUDIO ---
        let audioCtx = null;
        let nextNoteTime = 0, noteIndex = 0;
        const melody = [261.63, 293.66, 329.63, 392.00, 440.00, 392.00];

        window.startGame = () => {
            document.getElementById('start-screen').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            nextNoteTime = audioCtx.currentTime;
            scheduleAudio();
            if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                renderer.domElement.requestPointerLock();
            }
        };

        function scheduleAudio() {
            if (!audioCtx) return;
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                playNote(melody[noteIndex % melody.length], nextNoteTime);
                noteIndex++; nextNoteTime += 0.6;
            }
            requestAnimationFrame(scheduleAudio);
        }

        function playNote(freq, time) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(0.015, time + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.5);
        }

        function playSFX(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            if (type === 'jump') { osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(300, t + 0.1); gain.gain.setValueAtTime(0.1, t); }
            else if (type === 'pop') { osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(800, t + 0.1); gain.gain.setValueAtTime(0.1, t); }
            else if (type === 'thud') { osc.type = 'square'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.1); gain.gain.setValueAtTime(0.1, t); }
            else if (type === 'baaa') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(150, t + 0.3); gain.gain.setValueAtTime(0.03, t); }
            gain.gain.linearRampToValueAtTime(0, t + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.3);
        }

        function playNewDayChime() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            [523.25, 659.25, 783.99].forEach((f, i) => playNote(f, t + i * 0.12));
        }

        // --- SETUP ---
        let worldTime = 0;
        const DAY_CYCLE_SPEED = 0.00015; // full sun/moon arc ~12 real minutes — purely atmospheric now.
                                          // the game day itself only advances when the player sleeps.
        const interactDistance = 6; 
        window.activeTool = 'plow';
        const planets = [], activeAnims = [], interactables = [], creatures = [], weeds = [], crops = [];
        let camPitch = 0.2, camZoom = 18, initialPinchDist = null;

        // --- CORE LOOP DATA ---
        const CROP_DEFS = {
            turnip:  { name: 'Turnip',  color: 0xd8a7f0, growDays: 2, regrowDays: 0, seedCost: 10, sellPrice: 25 },
            tomato:  { name: 'Tomato',  color: 0xff6347, growDays: 4, regrowDays: 3, seedCost: 25, sellPrice: 45 },
            pumpkin: { name: 'Pumpkin', color: 0xff8c00, growDays: 6, regrowDays: 0, seedCost: 60, sellPrice: 200 }
        };
        const STAGE_SCALE = [0.55, 0.85, 1.2]; // sprout, growing, mature
        const DIRT_DRY = 0x4e3524, DIRT_WET = 0x2a1810;
        function setMoundWet(mound, wet) {
            if (mound && mound.material) mound.material.color.set(wet ? DIRT_WET : DIRT_DRY);
        }

        const PROP_HITS = 3; // hits needed to fell a tree / break a rock
        const TERRAFORM_GAIN = { clear: 4, weed: 2, plow: 6 };
        function getPlotCap(progress) {
            if (progress >= 100) return Infinity;
            if (progress >= 75) return 10;
            if (progress >= 50) return 6;
            if (progress >= 25) return 3;
            return 0;
        }

        const gameState = {
            day: 1,
            money: 100,
            stamina: { current: 100, max: 100 },
            inventory: { wood: 10, stone: 5, produce: {} },
            pendingSale: {},
            selectedCrop: 'turnip'
        };

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- CUTESY GALAXY GENERATOR ---
        function createCutesyNebula() {
            const canvas = document.createElement('canvas');
            const W = 1024, H = 1024;
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');

            // Deep space base with subtle vertical depth
            const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#0a0318'); bgGrad.addColorStop(0.5, '#0e0224'); bgGrad.addColorStop(1, '#08010f');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            // Draws at x, and also at x±W if within r of an edge — makes content wrap
            // seamlessly around the sphere's east/west seam instead of cutting off.
            function wrapX(x, r, draw) {
                draw(x);
                if (x < r) draw(x + W);
                if (x > W - r) draw(x - W);
            }

            const ambient = ['rgba(255,100,200,0.07)', 'rgba(150,100,255,0.07)', 'rgba(50,200,255,0.05)'];
            for (let i = 0; i < 40; i++) {
                const x = Math.random()*W, y = Math.random()*H, r = Math.random()*300+100;
                const color = ambient[Math.floor(Math.random()*ambient.length)];
                wrapX(x, r, (px) => {
                    const grd = ctx.createRadialGradient(px, y, 0, px, y, r);
                    grd.addColorStop(0, color); grd.addColorStop(1, 'transparent');
                    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(px, y, r, 0, Math.PI*2); ctx.fill();
                });
            }

            // Galactic band: elongated nebula wisps along a diagonal spiral-arm sweep
            const bandColors = ['rgba(255,140,220,0.24)', 'rgba(160,120,255,0.24)', 'rgba(120,180,255,0.2)', 'rgba(255,205,150,0.16)'];
            const bandAngle = -0.35, bandCx = 512, bandCy = 460, cosA = Math.cos(bandAngle), sinA = Math.sin(bandAngle);
            for (let i = 0; i < 50; i++) {
                const t = (i/50 - 0.5) * 1400;
                const spread = (Math.random()-0.5) * 240;
                const r = Math.random()*150 + 50;
                const wx = bandCx + t*cosA - spread*sinA;
                const wy = bandCy + t*sinA + spread*cosA;
                const color = bandColors[Math.floor(Math.random()*bandColors.length)];
                wrapX(wx, r * 2, (px) => {
                    ctx.save();
                    ctx.translate(px, wy); ctx.rotate(bandAngle); ctx.scale(1.9, 0.45);
                    const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
                    grd.addColorStop(0, color); grd.addColorStop(1, 'transparent');
                    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
                    ctx.restore();
                });
            }

            // Bright galactic core glow (kept away from the seam, no wrap needed)
            const coreGrd = ctx.createRadialGradient(560, 430, 0, 560, 430, 260);
            coreGrd.addColorStop(0, 'rgba(255,245,220,0.55)');
            coreGrd.addColorStop(0.3, 'rgba(255,200,220,0.26)');
            coreGrd.addColorStop(1, 'transparent');
            ctx.fillStyle = coreGrd; ctx.beginPath(); ctx.arc(560, 430, 260, 0, Math.PI*2); ctx.fill();

            // Star scatter — denser along the galactic band, sparse elsewhere, varied brightness
            for (let i = 0; i < 1000; i++) {
                let x, y;
                if (Math.random() < 0.6) {
                    const t = (Math.random()-0.5) * 1400, spread = (Math.random()-0.5) * 260;
                    x = bandCx + t*cosA - spread*sinA;
                    y = bandCy + t*sinA + spread*cosA;
                } else { x = Math.random()*W; y = Math.random()*H; }
                x = ((x % W) + W) % W; // wrap into [0,W) — a point never needs a second draw
                const s = Math.random()*1.6 + 0.3, b = Math.random()*0.5 + 0.5;
                ctx.fillStyle = `rgba(255,255,255,${b})`;
                ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI*2); ctx.fill();
            }

            // Soften the poles (top/bottom rows pinch to a point on the sphere) back
            // toward the flat base color so any pinching isn't a visible starburst.
            const poleFadeH = 70;
            const topFade = ctx.createLinearGradient(0, 0, 0, poleFadeH);
            topFade.addColorStop(0, '#0a0318'); topFade.addColorStop(1, 'rgba(10,3,24,0)');
            ctx.fillStyle = topFade; ctx.fillRect(0, 0, W, poleFadeH);
            const botFade = ctx.createLinearGradient(0, H-poleFadeH, 0, H);
            botFade.addColorStop(0, 'rgba(8,1,15,0)'); botFade.addColorStop(1, '#08010f');
            ctx.fillStyle = botFade; ctx.fillRect(0, H-poleFadeH, W, poleFadeH);

            return new THREE.CanvasTexture(canvas);
        }

        const nebGeo = new THREE.SphereGeometry(4200, 32, 32);
        const nebMat = new THREE.MeshBasicMaterial({ map: createCutesyNebula(), side: THREE.BackSide });
        scene.add(new THREE.Mesh(nebGeo, nebMat));

        const celestialSun = new THREE.Mesh(new THREE.SphereGeometry(60, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdd88 }));
        const celestialMoon = new THREE.Mesh(new THREE.SphereGeometry(40, 16, 16), new THREE.MeshBasicMaterial({ color: 0xccccff }));
        scene.add(celestialSun, celestialMoon);

        const stars = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({color: 0xffffff, size: 3, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false}));
        const starPts = [];
        for(let i=0; i<8000; i++) {
            const v = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize().multiplyScalar(3400 + Math.random()*500);
            starPts.push(v.x, v.y, v.z);
        }
        stars.geometry.setAttribute('position', new THREE.Float32BufferAttribute(starPts, 3));
        scene.add(stars);

        const sunLight = new THREE.DirectionalLight(0xfff5ee, 1.3); sunLight.castShadow = true;
        const ambLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(sunLight, ambLight);

        function addOutline(mesh, thickness = 0.1) {
            const outline = new THREE.Mesh(mesh.geometry, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }));
            outline.scale.multiplyScalar(1 + thickness);
            mesh.add(outline);
            return outline;
        }

        // --- PLANETS & PROPS ---
        function createPlanet(x, y, z, radius, color, name, deco, startTerraform = 0, skipDecoration = false) {
            const p = new THREE.Mesh(new THREE.IcosahedronGeometry(radius, 6), new THREE.MeshToonMaterial({ color }));
            p.position.set(x, y, z);
            p.userData = { radius, name, type: 'planet', terraformProgress: startTerraform, baseColor: color };
            p.receiveShadow = true; scene.add(p); planets.push(p); addOutline(p, 0.02);
            applyTerraformVisual(p);

            if (!skipDecoration) {
                for(let i=0; i<deco; i++) {
                    const normal = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
                    const pos = normal.clone().multiplyScalar(radius).add(p.position);
                    const isTree = Math.random() > 0.4;
                    const mesh = isTree ? 
                        new THREE.Mesh(new THREE.ConeGeometry(radius*0.07, radius*0.25, 6), new THREE.MeshToonMaterial({color: 0x2e7d32})) :
                        new THREE.Mesh(new THREE.DodecahedronGeometry(radius*0.06), new THREE.MeshToonMaterial({color: 0x757575}));
                    mesh.position.copy(pos);
                    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), normal);
                    mesh.userData = { type: 'prop', resource: isTree ? 'wood' : 'stone', planet: p, hitsRemaining: PROP_HITS };
                    mesh.castShadow = true; scene.add(mesh); addOutline(mesh, 0.1); interactables.push(mesh);
                }
                for(let i=0; i<8; i++) spawnWeed(p);
            }
            
            for(let i=0; i<3; i++) {
                const sheep = new THREE.Group();
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 10, 10), new THREE.MeshToonMaterial({color: 0xffffff}));
                sheep.add(body); addOutline(body, 0.1);
                const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 4, 4), new THREE.MeshBasicMaterial({color: 0x000000}));
                const e1 = eye.clone(); e1.position.set(0.3, 0.2, 0.6);
                const e2 = eye.clone(); e2.position.set(-0.3, 0.2, 0.6);
                sheep.add(e1, e2);
                sheep.userData = { planet: p, offset: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(), jumpTime: Math.random()*10, e1, e2 };
                scene.add(sheep); creatures.push(sheep);
            }
            return p;
        }

        function applyTerraformVisual(p) {
            const t = Math.max(0, Math.min(100, p.userData.terraformProgress)) / 100;
            const lush = new THREE.Color(0x66cc66);
            const base = new THREE.Color(p.userData.baseColor);
            p.material.color.copy(base).lerp(lush, t);
        }

        function updateTerraformHUD() {
            const t = Math.round(currentPlanet.userData.terraformProgress);
            document.getElementById('terraform-fill').style.width = t + '%';
            document.getElementById('terraform-pct').innerText = t + '%';
        }

        function gainTerraform(planet, amount) {
            if (planet.userData.terraformProgress >= 100) return;
            planet.userData.terraformProgress = Math.min(100, planet.userData.terraformProgress + amount);

                const x = t.clientX, y = t.clientY;
                if (y > window.innerHeight * 0.75) {
                    if (x < window.innerWidth * 0.35) {
                        controls.L.active = true; controls.L.id = t.identifier; controls.L.origin = {x, y}; controls.L.curr = {x, y};
                        const base = document.getElementById('joy-L-base');

        window.addEventListener('touchmove', (e) => {

                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                camZoom = Math.max(8, Math.min(45, camZoom + (initialPinchDist - dist) * 0.05));
                initialPinchDist = dist;
            }
            for(let t of e.changedTouches) {
                if (controls.L.active && t.identifier === controls.L.id) {
                    controls.L.curr = {x: t.clientX, y: t.clientY};
                    const dx = t.clientX - controls.L.origin.x, dy = t.clientY - controls.L.origin.y;
                    const d = Math.min(Math.hypot(dx, dy), 40); const ang = Math.atan2(dy, dx);
                    document.getElementById('joy-L-knob').style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;

                    const bd = Math.min(Math.hypot(bx, by), 40); const ba = Math.atan2(by, bx);
                    document.getElementById('joy-R-knob').style.transform = `translate(${Math.cos(ba)*bd}px, ${Math.sin(ba)*bd}px)`;
                }
            }
        }, {passive: false});

        // --- CORE LOOP HELPERS ---

        const SPROUT_COLOR = new THREE.Color(0x9ccc65);
        function createCropMesh(cropId) {
            const def = CROP_DEFS[cropId];
            const crop = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.55, 6), new THREE.MeshToonMaterial({ color: SPROUT_COLOR.getHex() }));
            crop.castShadow = true;
            crop.userData = { type: 'crop', cropId, stage: 0, daysGrown: 0, wateredToday: false, wilted: false, popping: false, moundRef: null };
            addOutline(crop, 0.15);
            return crop;
        }

        function updateCropVisual(c) {
            if (c.userData.wilted) { c.material.color.set(0x9e9e8a); return; }
            const target = new THREE.Color(CROP_DEFS[c.userData.cropId].color);
            if (c.userData.stage === 0) c.material.color.copy(SPROUT_COLOR);
            else if (c.userData.stage === 1) c.material.color.copy(SPROUT_COLOR).lerp(target, 0.5);
            else c.material.color.copy(target);
        }

        function plantCrop(mound, cropId) {
            const crop = createCropMesh(cropId);
            crop.position.copy(mound.position); crop.quaternion.copy(mound.quaternion); crop.translateY(0.35);
            crop.scale.set(0,0,0); crop.userData.popping = true; crop.userData.moundRef = mound;
            mound.userData.hasCrop = true;
            mound.userData.cropRef = crop;
            scene.add(crop);
            interactables.push(crop); crops.push(crop);
            activeAnims.push({ obj: crop, time: 0, targetY: STAGE_SCALE[0], targetXZ: STAGE_SCALE[0], type: 'pop' });
            playSFX('pop');
            return crop;
        }

        function waterCrop(c) {
            if (c.userData.wateredToday) { flashStatus('Already watered!'); return; }
            if (gameState.stamina.current < 2) { flashStatus('Too tired to water!'); return; }
            gameState.stamina.current -= 2;
            c.userData.wateredToday = true;
            c.userData.wilted = false;
            updateCropVisual(c);
            setMoundWet(c.userData.moundRef, true);
            playSFX('pop');
            updateInventory();
            broadcastWorldSync();
        }

        function harvestCrop(c) {
            const def = CROP_DEFS[c.userData.cropId];
            gameState.inventory.produce[c.userData.cropId] = (gameState.inventory.produce[c.userData.cropId] || 0) + 1;
            playSFX('pop');
            flashStatus('Harvested ' + def.name + '!');
            if (def.regrowDays > 0) {
                c.userData.stage = 1;
                c.userData.daysGrown = Math.max(0, def.growDays - def.regrowDays);
                c.userData.wateredToday = false;
                c.userData.wilted = false;
                updateCropVisual(c);
                c.userData.popping = true;
                activeAnims.push({ obj: c, time: 0, targetY: STAGE_SCALE[1], targetXZ: STAGE_SCALE[1], type: 'pop' });
            } else {
                if (c.userData.moundRef) {
                    c.userData.moundRef.userData.hasCrop = false;
                    c.userData.moundRef.userData.cropRef = null;
                    setMoundWet(c.userData.moundRef, false);
                }
                interactables.splice(interactables.indexOf(c), 1);
                crops.splice(crops.indexOf(c), 1);
                activeAnims.push({ obj: c, time: 0, type: 'destroy' });
            }
            updateInventory();
            broadcastWorldSync();
        }

        function depositProduce() {
            let count = 0;
            for (const id in gameState.inventory.produce) {
                const qty = gameState.inventory.produce[id];
                if (qty > 0) {
                    gameState.pendingSale[id] = (gameState.pendingSale[id] || 0) + qty;
                    count += qty;
                    gameState.inventory.produce[id] = 0;
                }
            }
            if (count === 0) { flashStatus('Nothing to sell!'); return; }
            flashStatus('Deposited ' + count + (count > 1 ? ' items!' : ' item!'));
            playSFX('thud');
            updateInventory();
            broadcastWorldSync();
        }

        function sleep() {
            let earned = 0;
            for (const id in gameState.pendingSale) {
                earned += gameState.pendingSale[id] * CROP_DEFS[id].sellPrice;
                gameState.pendingSale[id] = 0;
            }
            gameState.money += earned;

            crops.forEach(c => {
                const def = CROP_DEFS[c.userData.cropId];
                if (c.userData.stage < 2) {
                    if (c.userData.wateredToday) { c.userData.daysGrown++; c.userData.wilted = false; }
                    else if (c.userData.daysGrown > 0) { c.userData.wilted = true; }
                }
                c.userData.wateredToday = false;
                setMoundWet(c.userData.moundRef, false);
                const progress = c.userData.daysGrown / def.growDays;
                c.userData.stage = progress >= 1 ? 2 : (progress >= 0.34 ? 1 : 0);
                updateCropVisual(c);
            });

            gameState.stamina.current = gameState.stamina.max;
            gameState.day++;
            worldTime = 0;
            playNewDayChime();
            flashStatus(earned > 0 ? `Day ${gameState.day}! +${earned}c` : `Day ${gameState.day}`);
            updateInventory();
            saveGame();
            broadcastWorldSync();
        }

        // --- SAVE / LOAD (localStorage) ---
        const SAVE_KEY = 'galaxyFarmSave';
        const v3 = (v) => ({ x: v.x, y: v.y, z: v.z });
        const q4 = (q) => ({ x: q.x, y: q.y, z: q.z, w: q.w });

        function collectSaveData() {
            const data = {
                version: 1,
                day: gameState.day, money: gameState.money, stamina: gameState.stamina.current,
                inventory: gameState.inventory, pendingSale: gameState.pendingSale, selectedCrop: gameState.selectedCrop,
                playerPos: v3(player.position),
                planets: planets.map(p => ({ terraformProgress: p.userData.terraformProgress })),
                props: [], weeds: [], mounds: [], fences: [], crops: []
            };
            const moundIndexMap = new Map();
            interactables.forEach(o => {
                const t = o.userData.type;
                const planetIdx = planets.indexOf(o.userData.planet);
                if (planetIdx < 0) return;
                if (t === 'prop') data.props.push({ planetIdx, pos: v3(o.position), quat: q4(o.quaternion), resource: o.userData.resource, hits: o.userData.hitsRemaining });
                else if (t === 'weed') data.weeds.push({ planetIdx, pos: v3(o.position), quat: q4(o.quaternion) });
                else if (t === 'fence') data.fences.push({ planetIdx, pos: v3(o.position), quat: q4(o.quaternion) });
                else if (t === 'mound') { moundIndexMap.set(o, data.mounds.length); data.mounds.push({ planetIdx, pos: v3(o.position), quat: q4(o.quaternion), hasCrop: o.userData.hasCrop }); }
            });
            crops.forEach(c => {
                data.crops.push({
                    moundIndex: moundIndexMap.get(c.userData.moundRef),
                    cropId: c.userData.cropId, stage: c.userData.stage, daysGrown: c.userData.daysGrown,
                    wateredToday: c.userData.wateredToday, wilted: c.userData.wilted
                });
            });
            return data;
        }

        function saveGame() {
            try { localStorage.setItem(SAVE_KEY, JSON.stringify(collectSaveData())); }
            catch (e) { console.warn('Save failed', e); }
        }

        function rebuildWorldObjects(data) {
            const vec = (v) => new THREE.Vector3(v.x, v.y, v.z);
            const quat = (q) => new THREE.Quaternion(q.x, q.y, q.z, q.w);

            data.planets.forEach((pd, i) => { if (planets[i]) { planets[i].userData.terraformProgress = pd.terraformProgress; applyTerraformVisual(planets[i]); } });

            data.props.forEach(pd => {
                const planet = planets[pd.planetIdx];
                if (!planet || pd.hits <= 0) return;
                const isTree = pd.resource === 'wood';
                const mesh = isTree
                    ? new THREE.Mesh(new THREE.ConeGeometry(planet.userData.radius*0.07, planet.userData.radius*0.25, 6), new THREE.MeshToonMaterial({color: 0x2e7d32}))
                    : new THREE.Mesh(new THREE.DodecahedronGeometry(planet.userData.radius*0.06), new THREE.MeshToonMaterial({color: 0x757575}));
                mesh.position.copy(vec(pd.pos)); mesh.quaternion.copy(quat(pd.quat));
                mesh.userData = { type: 'prop', resource: pd.resource, planet, hitsRemaining: pd.hits };
                mesh.castShadow = true; scene.add(mesh); addOutline(mesh, 0.1); interactables.push(mesh);
            });

            data.weeds.forEach(wd => {
                const planet = planets[wd.planetIdx]; if (!planet) return;
                const weed = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 4), new THREE.MeshToonMaterial({color: 0xb2ff59}));
                weed.position.copy(vec(wd.pos)); weed.quaternion.copy(quat(wd.quat));
                weed.userData = { type: 'weed', planet, phase: Math.random()*10 };
                scene.add(weed); interactables.push(weed); weeds.push(weed); addOutline(weed, 0.2);
            });

            const restoredMounds = [];
            data.mounds.forEach(md => {
                const planet = planets[md.planetIdx]; if (!planet) { restoredMounds.push(null); return; }
                const mound = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 8), new THREE.MeshToonMaterial({color: DIRT_DRY}));
                mound.position.copy(vec(md.pos)); mound.quaternion.copy(quat(md.quat));
                mound.scale.set(1, 0.2, 1);
                mound.userData = { type: 'mound', planet, hasCrop: md.hasCrop, cropRef: null };
                scene.add(mound); interactables.push(mound); addOutline(mound, 0.05);
                restoredMounds.push(mound);
            });

            data.fences.forEach(fd => {
                const planet = planets[fd.planetIdx]; if (!planet) return;
                const fence = new THREE.Group();
                const post = new THREE.Mesh(new THREE.BoxGeometry(0.25,1,0.25), new THREE.MeshToonMaterial({color:0x5d4037}));
                const rail = new THREE.Mesh(new THREE.BoxGeometry(1.4,0.25,0.1), new THREE.MeshToonMaterial({color:0x795548}));
                const fp1 = post.clone(); fp1.position.x = -0.6; const fp2 = post.clone(); fp2.position.x = 0.6; rail.position.y = 0.3;
                fence.add(fp1, fp2, rail);
                fence.position.copy(vec(fd.pos)); fence.quaternion.copy(quat(fd.quat));
                fence.userData = { type: 'fence', planet };
                scene.add(fence); interactables.push(fence);
            });

            data.crops.forEach(cd => {
                const mound = restoredMounds[cd.moundIndex]; if (!mound) return;
                const crop = createCropMesh(cd.cropId);
                crop.position.copy(mound.position); crop.quaternion.copy(mound.quaternion); crop.translateY(0.35);
                crop.userData.stage = cd.stage; crop.userData.daysGrown = cd.daysGrown;
                crop.userData.wateredToday = cd.wateredToday; crop.userData.wilted = cd.wilted;
                crop.userData.moundRef = mound;
                mound.userData.cropRef = crop;
                updateCropVisual(crop);
                if (cd.wateredToday) setMoundWet(mound, true);
                scene.add(crop); interactables.push(crop); crops.push(crop);
            });
        }

            gameState.day = data.day; gameState.money = data.money;

        // --- MULTIPLAYER (PeerJS, host-authoritative, real-time) ---
        // Host owns the real farm state. A guest's actions are requests the host applies
        // and reflects back — this is what makes "both work the same plot at once" safe.
        let mpPeer = null, isHost = false, hostConn = null, netWorldInitialized = false;
        const guestConns = new Map();      // host side: peerId -> DataConnection
        const remotePlayers = new Map();   // both sides: peerId -> { mesh }
        let lastMoveSent = 0;

        function shortRoomCode() { return Math.random().toString(36).substring(2, 7).toUpperCase(); }

        function makeRemoteAvatar() {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.7, 4, 8), new THREE.MeshToonMaterial({ color: 0x88ccff }));
            body.position.y = 0.8; g.add(body); addOutline(body, 0.1);
            scene.add(g);
            return g;
        }
        function updateRemotePlayer(id, pos, quat) {
            let rp = remotePlayers.get(id);
            if (!rp) { rp = { mesh: makeRemoteAvatar(), targetPos: new THREE.Vector3(), targetQuat: new THREE.Quaternion() }; remotePlayers.set(id, rp); }
            rp.targetPos.set(pos.x, pos.y, pos.z);
            rp.targetQuat.set(quat.x, quat.y, quat.z, quat.w);
        }
        function removeRemotePlayer(id) {
            const rp = remotePlayers.get(id);
            if (rp) { scene.remove(rp.mesh); remotePlayers.delete(id); }
        }

        function mpStatus(msg) { const el = document.getElementById('mp-status'); if (el) el.innerText = msg; }

        window.hostGame = () => {
            if (mpPeer) return;
            mpPeer = new Peer(shortRoomCode());
            mpPeer.on('open', (id) => {
                document.getElementById('mp-room-code').innerText = id;
                document.getElementById('mp-room-row').style.display = 'block';
                mpStatus('Waiting for a friend to join...');
            });
            mpPeer.on('connection', (conn) => {
                isHost = true;
                guestConns.set(conn.peer, conn);
                conn.on('open', () => {
                    mpStatus('Friend connected!');
                    conn.send({ type: 'snapshot', data: collectSaveData() });
                });
                conn.on('data', (msg) => handleGuestMessage(conn, msg));
                conn.on('close', () => { removeRemotePlayer(conn.peer); guestConns.delete(conn.peer); mpStatus('Friend disconnected.'); });
            });
            mpPeer.on('error', (err) => mpStatus('Connection error: ' + err.type));
        };

        window.joinGame = () => {
            const code = document.getElementById('mp-join-code').value.trim().toUpperCase();
            if (!code || mpPeer) return;
            mpPeer = new Peer(shortRoomCode());
            mpPeer.on('open', () => {
                hostConn = mpPeer.connect(code);
                hostConn.on('open', () => mpStatus('Connected! Loading farm...'));
                hostConn.on('data', (msg) => handleHostMessage(msg));
                hostConn.on('close', () => mpStatus('Disconnected from farm.'));
            });
            mpPeer.on('error', (err) => mpStatus('Connection error: ' + err.type));
        };

        function isGuest() { return !!hostConn; }

        function clearWorldObjects() {
            for (let i = interactables.length - 1; i >= 0; i--) {
                const t = interactables[i].userData.type;
                if (t === 'bed' || t === 'bin') continue;
                scene.remove(interactables[i]);
                interactables.splice(i, 1);
            }
            weeds.length = 0; crops.length = 0;
        }

        function applyNetSnapshot(data) {
            const firstSync = !netWorldInitialized;
            clearWorldObjects();
            gameState.day = data.day; gameState.money = data.money;
            gameState.inventory = data.inventory; gameState.pendingSale = data.pendingSale;
            // stamina and selectedCrop stay personal to this guest — not overwritten
            rebuildWorldObjects(data);
            updateInventory();
            netWorldInitialized = true;
            if (firstSync) {
                player.position.set(data.playerPos.x, data.playerPos.y + 3, data.playerPos.z + 3);
                mpStatus('On the farm!');
            }
        }

        function handleHostMessage(msg) {
            if (msg.type === 'snapshot') applyNetSnapshot(msg.data);
        }

        function findNearestOfType(pos, type, maxDist) {
            let best = null, bestD = maxDist;
            interactables.forEach(o => {
                if (o.userData.type !== type) return;
                const d = o.position.distanceTo(pos);
                if (d < bestD) { bestD = d; best = o; }
            });
            return best;
        }

        function applyGuestAction(msg) {
            if (msg.tool === 'deposit') { depositProduce(); return; }
            const pos = new THREE.Vector3(msg.pos.x, msg.pos.y, msg.pos.z);
            if (msg.tool === 'water') {
                const c = findNearestOfType(pos, 'crop', 0.6); if (c) waterCrop(c);
            } else if (msg.tool === 'harvest') {
                const c = findNearestOfType(pos, 'crop', 0.6); if (c) harvestCrop(c);
            } else if (msg.tool === 'plant') {
                const mound = findNearestOfType(pos, 'mound', 0.6);
                const def = CROP_DEFS[msg.cropId];
                if (mound && !mound.userData.hasCrop && def && gameState.money >= def.seedCost) {
                    gameState.money -= def.seedCost;
                    plantCrop(mound, msg.cropId);
                    updateInventory();
                    broadcastWorldSync();
                }
            }
        }

        function handleGuestMessage(conn, msg) {
            if (msg.type === 'move') updateRemotePlayer(conn.peer, msg.pos, msg.quat);
            else if (msg.type === 'action') applyGuestAction(msg);
        }

        function broadcastWorldSync() {
            if (!isHost || guestConns.size === 0) return;
            const data = collectSaveData();
            guestConns.forEach(conn => { if (conn.open) conn.send({ type: 'snapshot', data }); });
        }

        function sendMovement() {
            const p = { x: player.position.x, y: player.position.y, z: player.position.z };
            const q = { x: player.quaternion.x, y: player.quaternion.y, z: player.quaternion.z, w: player.quaternion.w };
            if (isHost) guestConns.forEach(conn => { if (conn.open) conn.send({ type: 'move', pos: p, quat: q }); });
            else if (hostConn && hostConn.open) hostConn.send({ type: 'move', pos: p, quat: q });
        }

        // Guest-side: intercepts water/plant/harvest/deposit and sends them to the host instead
        // of applying locally. Everything else (plow, hammer, fence, sleep) stays host-only for now.
        function handleGuestAction(obj, type) {
            if (type === 'bed') { flashStatus('Only the farm owner can sleep here.'); return true; }
            if (type === 'bin') { sendMPAction({ tool: 'deposit' }); return true; }
            if (type === 'crop' && obj.userData.stage === 2) { sendMPAction({ tool: 'harvest', pos: v3(obj.position) }); return true; }
            if (type === 'crop' && window.activeTool === 'water') {
                if (gameState.stamina.current < 2) { flashStatus('Too tired to water!'); return true; }
                gameState.stamina.current -= 2; updateInventory();
                sendMPAction({ tool: 'water', pos: v3(obj.position) }); return true;
            }
            if (window.activeTool === 'water' && type === 'mound' && obj.userData.hasCrop) {
                const mature = obj.userData.cropRef.userData.stage === 2;
                if (!mature) {
                    if (gameState.stamina.current < 2) { flashStatus('Too tired to water!'); return true; }
                    gameState.stamina.current -= 2; updateInventory();
                }
                sendMPAction({ tool: mature ? 'harvest' : 'water', pos: v3(obj.position) }); return true;
            }
            if (window.activeTool === 'water' && type === 'mound') { flashStatus('Plant a seed first!'); return true; }
            if (window.activeTool === 'seed' && type === 'mound' && !obj.userData.hasCrop) {
                sendMPAction({ tool: 'plant', pos: v3(obj.position), cropId: gameState.selectedCrop }); return true;
            }
            if (window.activeTool === 'seed' && type === 'mound' && obj.userData.hasCrop) { flashStatus('Already planted!'); return true; }
            flashStatus("Can't do that here yet as a guest.");
            return true;
        }

        function sendMPAction(action) {
            if (hostConn && hostConn.open) hostConn.send({ type: 'action', ...action });
        }

        // --- INTERACTION ---
        function handleInteraction(x, y) {
            const mouse = new THREE.Vector2();
            if (document.pointerLockElement) { mouse.set(0, 0); }
            else { mouse.set((x/window.innerWidth)*2-1, -(y/window.innerHeight)*2+1); }

            const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
            const iHits = ray.intersectObjects(interactables, true);
            const pHits = ray.intersectObject(currentPlanet);
            
            const hit = iHits[0];
            if (hit && hit.point.distanceTo(player.position) < interactDistance) {
                // Resolve to whichever object actually OWNS the userData — a tap can land on an
                // outline shell (a child mesh with no userData of its own), so we walk up to
                // the real mound/crop/prop/etc rather than operating on the outline by mistake.
                const rawObj = hit.object;
                const obj = rawObj.userData.type ? rawObj : (rawObj.parent || rawObj);
                const type = obj.userData.type;

                if (isGuest()) { handleGuestAction(obj, type); return; }

                if (type === 'bed') {
                    if (gameState.stamina.current >= gameState.stamina.max) {
                        flashStatus("Not tired yet — do some work first!");
                    } else {
                        sleep();
                    }
                } else if (type === 'bin') {
                    depositProduce();
                } else if (type === 'crop' && obj.userData.stage === 2) {
                    harvestCrop(obj);
                } else if (type === 'crop' && window.activeTool === 'water') {
                    waterCrop(obj);
                } else if (type === 'crop' && window.activeTool === 'hammer') {
                    if (obj.userData.moundRef) {
                        obj.userData.moundRef.userData.hasCrop = false;
                        obj.userData.moundRef.userData.cropRef = null;
                        setMoundWet(obj.userData.moundRef, false);
                    }
                    playSFX('pop');
                    activeAnims.push({ obj, time: 0, type: 'destroy' });
                    interactables.splice(interactables.indexOf(obj), 1);
                    crops.splice(crops.indexOf(obj), 1);
                } else if (window.activeTool === 'water' && type === 'mound' && obj.userData.hasCrop) {
                    const cropRef = obj.userData.cropRef;
                    if (cropRef.userData.stage === 2) harvestCrop(cropRef);
                    else waterCrop(cropRef);
                } else if (window.activeTool === 'water' && type === 'mound') {
                    flashStatus('Plant a seed first!');
                } else if (window.activeTool === 'hammer' && type === 'prop') {
                    obj.userData.hitsRemaining--;
                    if (obj.userData.hitsRemaining > 0) {
                        playSFX('thud');
                        flashStatus(obj.userData.hitsRemaining + ' more hit' + (obj.userData.hitsRemaining > 1 ? 's' : '') + '!');
                        activeAnims.push({ obj, time: 0, type: 'hitflash', baseScale: obj.scale.x || 1 });
                    } else {
                        obj.userData.resource === 'wood' ? gameState.inventory.wood++ : gameState.inventory.stone++;
                        gainTerraform(obj.userData.planet, TERRAFORM_GAIN.clear);
                        activeAnims.push({ obj, time: 0, type: 'destroy' });
                        interactables.splice(interactables.indexOf(obj), 1); playSFX('pop'); updateInventory();
                    }
                    broadcastWorldSync();
                } else if (window.activeTool === 'hammer') {
                    if (type === 'fence') gameState.inventory.wood++;
                    if (type === 'weed') gainTerraform(obj.userData.planet, TERRAFORM_GAIN.weed);
                    activeAnims.push({ obj, time: 0, type: 'destroy' });
                    interactables.splice(interactables.indexOf(obj), 1); playSFX('pop'); updateInventory();
                    broadcastWorldSync();
                } else if (window.activeTool === 'fence' && type === 'fence') {
                    obj.rotateY(Math.PI/4); playSFX('thud');
                } else if (window.activeTool === 'seed' && type === 'mound' && !obj.userData.hasCrop) {
                    const def = CROP_DEFS[gameState.selectedCrop];
                    if (gameState.money < def.seedCost) { flashStatus(`Need ${def.seedCost}c for ${def.name}`); return; }
                    gameState.money -= def.seedCost;
                    plantCrop(obj, gameState.selectedCrop);
                    updateInventory();
                    flashStatus('Planted ' + def.name + '!');
                    broadcastWorldSync();
                } else if (window.activeTool === 'seed' && type === 'mound' && obj.userData.hasCrop) {
                    flashStatus('Already planted!');
                }
            } else if (pHits[0] && pHits[0].point.distanceTo(player.position) < interactDistance) {
                if (isGuest()) { flashStatus("Can't do that here yet as a guest."); return; }
                const p = pHits[0].object;
                const norm = pHits[0].face.normal.clone().transformDirection(p.matrixWorld).normalize();
                const pos = norm.clone().multiplyScalar(p.userData.radius).add(p.position);
                let overlap = false;
                for(let i of interactables) { if(i.position.distanceTo(pos) < (window.activeTool === 'fence' ? 0.5 : 0.85)) overlap = true; }
                if (!overlap) {
                    if (window.activeTool === 'plow') {
                        const cap = getPlotCap(p.userData.terraformProgress);
                        if (cap <= 0) { flashStatus('Terraform this planet more first!'); return; }
                        const currentMounds = interactables.filter(o => o.userData.type === 'mound' && o.userData.planet === p).length;
                        if (currentMounds >= cap) { flashStatus('No room to plow until you terraform further!'); return; }
                        if (gameState.stamina.current < 3) { flashStatus('Too tired to plow!'); return; }
                        gameState.stamina.current -= 3;
                        const mound = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 8), new THREE.MeshToonMaterial({ color: DIRT_DRY }));
                        mound.position.copy(pos).add(norm.clone().multiplyScalar(0.05));
                        mound.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), norm);
                        mound.userData = { type: 'mound', planet: p, hasCrop: false, cropRef: null };
                        mound.scale.set(0,0,0); scene.add(mound); interactables.push(mound); addOutline(mound, 0.05);
                        activeAnims.push({ obj: mound, time: 0, targetY: 0.2, targetXZ: 1.0, type: 'pop' }); playSFX('pop'); updateInventory();
                        gainTerraform(p, TERRAFORM_GAIN.plow);
                        broadcastWorldSync();
                    } else if (window.activeTool === 'fence' && gameState.inventory.wood > 0) {
                        gameState.inventory.wood--; updateInventory();
                        const fence = new THREE.Group();
                        const post = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1, 0.25), new THREE.MeshToonMaterial({color: 0x5d4037}));
                        const rail = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.25, 0.1), new THREE.MeshToonMaterial({color: 0x795548}));
                        const p1 = post.clone(); p1.position.x = -0.6; const p2 = post.clone(); p2.position.x = 0.6; rail.position.y = 0.3;
                        fence.add(p1, p2, rail); fence.position.copy(pos);
                        const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), norm);
                        const look = player.position.clone().sub(pos).projectOnPlane(norm).normalize();
                        const m = new THREE.Matrix4().lookAt(pos, pos.clone().add(look), norm); q.setFromRotationMatrix(m);
                        fence.quaternion.copy(q); fence.userData = { type: 'fence', planet: p };
                        fence.scale.set(0,0,0); scene.add(fence); interactables.push(fence);
                        activeAnims.push({ obj: fence, time: 0, targetY: 1, targetXZ: 1, type: 'pop' }); playSFX('thud');
                    }
                }
            }
        }

        function handleJump() {
            if (!isGrounded) return;
            const up = player.position.clone().sub(currentPlanet.position).normalize();
            if (targetPlanet) velocity.copy(targetPlanet.position.clone().sub(player.position).normalize().multiplyScalar(player.position.distanceTo(targetPlanet.position) * 0.052)).addScaledVector(up, 0.3);
            else velocity.copy(up).multiplyScalar(0.7);
            isGrounded = false; playSFX('jump');
        }

        function showBaaaBubble(pos) {
            const bubble = document.createElement('div');
            bubble.className = 'baaa-bubble'; bubble.innerText = 'Baaa!';
            document.body.appendChild(bubble);
            const vector = pos.clone().project(camera);
            bubble.style.left = `${(vector.x + 1) / 2 * window.innerWidth}px`;
            bubble.style.top = `${(-vector.y + 1) / 2 * window.innerHeight - 30}px`;
            setTimeout(() => { bubble.style.opacity = 0; setTimeout(() => bubble.remove(), 500); }, 1000);
        }

        if (hasSave) loadGame();
        updateTerraformHUD();
        updateInventory();

        function animate() {
            requestAnimationFrame(animate);
            worldTime += DAY_CYCLE_SPEED; 
            const cyclePos = worldTime % (Math.PI * 2);
            // Sun sweeps left -> zenith -> right over the first half of the cycle (day).
            // Moon = sunAngle + PI, so it rises on the left the instant the sun sets on the
            // right, arcs the same way, and hands back to the sun exactly as it sets.
            const sunAngle = Math.PI - cyclePos;
            const moonAngle = sunAngle + Math.PI;
            
            const icon = document.getElementById('celestial-icon');
            const hudAngle = (cyclePos % Math.PI);
            icon.style.left = (120 - Math.cos(hudAngle) * 100) + 'px';
            icon.style.top = (50 - Math.sin(hudAngle) * 40) + 'px';
            const isDay = Math.sin(sunAngle) > -0.2;
            icon.innerText = isDay ? '☀️' : '🌙';
            icon.style.filter = isDay ? 'drop-shadow(0 0 8px orange)' : 'drop-shadow(0 0 8px #fff)';

            const dayFactor = isDay ? Math.max(0, Math.sin(sunAngle)) : 0;
            sunLight.position.set(Math.cos(sunAngle)*1000, Math.sin(sunAngle)*1000, 0);
            sunLight.intensity = Math.max(0.1, dayFactor + 0.6);
            ambLight.intensity = Math.max(0.2, (dayFactor + 1) * 0.3);
            stars.material.opacity = Math.max(0.5, 1 - sunLight.intensity);

            celestialSun.position.set(Math.cos(sunAngle)*1200, Math.sin(sunAngle)*1200, 0);
            celestialMoon.position.set(Math.cos(moonAngle)*1200, Math.sin(moonAngle)*1200, 0);

            activeAnims.forEach((a, i) => {
                a.time += 0.08;
                if (a.type === 'pop') {
                    const b = Math.sin(Math.min(a.time * 5, Math.PI));
                    a.obj.scale.set(a.targetXZ * b, a.targetY * b, a.targetXZ * b);
                    if(a.time > 0.8) {
                        a.obj.scale.set(a.targetXZ, a.targetY, a.targetXZ);
                        if (a.obj.userData) a.obj.userData.popping = false;
                        activeAnims.splice(i, 1);
                    }
                } else if (a.type === 'destroy') {
                    const s = Math.max(0, 1 - a.time); a.obj.scale.set(s,s,s);
                    if(s <= 0) { scene.remove(a.obj); activeAnims.splice(i,1); }
                } else if (a.type === 'hitflash') {
                    const b = Math.sin(Math.min(a.time * 8, Math.PI));
                    const s = a.baseScale * (1 + b * 0.25);
                    a.obj.scale.set(s, s, s);
                    if (a.time > 0.4) { a.obj.scale.set(a.baseScale, a.baseScale, a.baseScale); activeAnims.splice(i,1); }
                }
            });

            creatures.forEach(s => {
                s.userData.jumpTime += 0.05; 
                const hop = Math.sin(s.userData.jumpTime * 3); const hopHeight = Math.max(0, hop) * 0.6;
                s.position.lerp(s.userData.offset.clone().multiplyScalar(s.userData.planet.userData.radius + 0.6 + hopHeight).add(s.userData.planet.position), 0.2);
                s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), s.userData.offset);
                const stretch = 1 + Math.max(0, hop) * 0.3; const squish = 1 - Math.max(0, hop) * 0.15;
                s.scale.set(squish, stretch, squish);
                if (s.userData.planet === currentPlanet && Math.random() > 0.9998) { playSFX('baaa'); showBaaaBubble(s.position); }
            });

            weeds.forEach(w => { w.userData.phase += 0.05; const s = 1 + Math.sin(w.userData.phase) * 0.1; w.scale.set(s,s,s); });

            crops.forEach(c => {
                if (c.userData.popping) return;
                const base = STAGE_SCALE[c.userData.stage] * (c.userData.wilted ? 0.7 : 1);
                if (c.userData.stage === 2 && !c.userData.wilted) {
                    c.userData.pulsePhase = (c.userData.pulsePhase || 0) + 0.04;
                    const s = base * (1 + Math.sin(c.userData.pulsePhase) * 0.06);
                    c.scale.set(s, s, s);
                } else {
                    c.scale.set(base, base, base);
                }
            });

            // --- multiplayer: smooth remote avatars, throttled movement broadcast, guest stamina trickle ---
            remotePlayers.forEach(rp => { rp.mesh.position.lerp(rp.targetPos, 0.25); rp.mesh.quaternion.slerp(rp.targetQuat, 0.25); });
            if ((isHost || isGuest()) && performance.now() - lastMoveSent > 100) { lastMoveSent = performance.now(); sendMovement(); }
            if (isGuest() && gameState.stamina.current < gameState.stamina.max) {
                gameState.stamina.current = Math.min(gameState.stamina.max, gameState.stamina.current + 0.05);
                if (Math.random() < 0.02) updateInventory();
            }

            let closest = currentPlanet, dMin = Infinity;
            planets.forEach(p => { const d = player.position.distanceTo(p.position); if(d < dMin) { dMin = d; closest = p; }});
            if (closest !== currentPlanet) { currentPlanet = closest; document.getElementById('planet-name').innerText = currentPlanet.userData.name; updateTerraformHUD(); }

            const up = player.position.clone().sub(currentPlanet.position).normalize();
            if (player.position.distanceTo(currentPlanet.position) - currentPlanet.userData.radius <= 0.1 && velocity.dot(up) <= 0) {
                isGrounded = true; velocity.set(0,0,0); player.position.copy(up.clone().multiplyScalar(currentPlanet.userData.radius).add(currentPlanet.position));
            } else { isGrounded = false; velocity.addScaledVector(up, -0.015); }
            player.position.add(velocity);

            let mX = 0, mY = 0;
            if (controls.L.active) { 
                mX = Math.max(-1, Math.min(1, (controls.L.curr.x - controls.L.origin.x)/40)); mY = Math.max(-1, Math.min(1, (controls.L.curr.y - controls.L.origin.y)/40)); 
            } else {
                if (controls.keys['KeyA']) mX = -1; if(controls.keys['KeyD']) mX = 1; if(controls.keys['KeyW']) mY = -1; if(controls.keys['KeyS']) mY = 1; if(controls.keys['Space']) handleJump();
            }

            if (isGrounded) {
                player.position.addScaledVector(new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion), -mY * 0.25).addScaledVector(new THREE.Vector3(1,0,0).applyQuaternion(player.quaternion), -mX * 0.25);
            }
            player.quaternion.premultiply(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0).applyQuaternion(player.quaternion), up));
            const camPos = player.position.clone().add(up.clone().multiplyScalar(6 + (camPitch * 8))).add(new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion).multiplyScalar(camZoom));
            camera.position.lerp(camPos, 0.2); camera.lookAt(player.position.clone().add(up.clone().multiplyScalar(2))); camera.up.copy(up);
            
            targetPlanet = null; jumpLine.visible = false;
            const fwd = new THREE.Vector3(0,0,1).applyQuaternion(player.quaternion);
            planets.forEach(p => {
                if(p === currentPlanet) return;
                if(fwd.dot(p.position.clone().sub(player.position).normalize()) > 0.85) { 
                    targetPlanet = p; jumpLine.visible = true; 
                    const mid = player.position.clone().add(p.position).multiplyScalar(0.5).add(up.clone().multiplyScalar(10));
                    const curve = new THREE.QuadraticBezierCurve3(player.position, mid, p.position);
                    jumpLine.geometry.setFromPoints(curve.getPoints(20));
                }
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
